{% load i18n %}
{% if user.is_authenticated %}
  {% if signed_in %}
    <a class="nav-pill employer-account-link"
       href="/employer/connected/?lang={{ page_language }}">{% translate "My employer space" context "employer auth-shell" %}</a>
  {% endif %}
  <form action="{% url 'magic_logout' %}" method="post">
    {% csrf_token %}
    <button class="nav-pill employer-account-link" type="submit">{% translate "Sign out" %}</button>
  </form>
{% else %}
  <a class="nav-pill employer-account-link"
     href="{% url 'magic_login' %}?lang={{ page_language }}">{% translate "Sign in" %}</a>
{% endif %}
