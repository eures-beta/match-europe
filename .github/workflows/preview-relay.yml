name: Relais des recettes

on:
  workflow_run:
    workflows: [Demande de recette]
    types: [completed]

permissions: {}

jobs:
  relay:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # This workflow comes from main. It never checks out or executes PR code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DISPATCH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.DISPATCH_TOKEN;
            if (!token) {
              core.setFailed('Configurer PREVIEW_DISPATCH_TOKEN : accès Actions écriture au seul dépôt privé de déploiement.');
              return;
            }
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/preview-request.yml' || !Number.isSafeInteger(run.id)) {
              core.setFailed('Origine du signal inattendue.');
              return;
            }
            const response = await fetch(
              'https://api.github.com/repos/eures-beta/match-europe-deploy-clever/actions/workflows/previews.yml/dispatches',
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({ref: 'main', inputs: {source_run: String(run.id)}})
              }
            );
            if (!response.ok) core.setFailed(`Le contrôleur privé a refusé le signal (${response.status}).`);
