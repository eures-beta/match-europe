name: Vérification de main avant déploiement

on:
  workflow_dispatch:
  push:
    # Validate every internal branch, including PRs with merge conflicts.
    branches: ['**']
  # Forks have no push event in this repository; validate their PR event instead.
  pull_request:

permissions:
  contents: read

jobs:
  e2e-memory:
    # Internal PR events are skipped, not started and subsequently cancelled.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Parcours HTTP — 256 Mio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Le témoin négatif exporte exactement le code historique avant #177.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Vérifier les parcours actuels sous plafond mémoire réel
        run: make e2e-test
      - name: Vérifier que le banc détecte la régression historique
        run: make e2e-regression
      - name: Publier uniquement les mesures, jamais les emails ou liens secrets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-memory-reports
          path: |
            .runtime/e2e-report.json
            .runtime/e2e-legacy-report.json
          if-no-files-found: ignore
  test:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # The full PostgreSQL suite includes populated migration round trips.
    # At >1,000 tests it can exceed 15 minutes on a shared runner.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tests
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: '0'
      DJANGO_HTTPS: '0'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: tests
      PGUSER: tests
      PGPASSWORD: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Vérifier la maintenance du runtime sans réseau
        run: make python-runtime-verify
      - name: Installer les dépendances applicatives et de test
        run: make install-test
      - name: Installer GNU gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Vérifier les traductions extraites et compiler les catalogues
        run: |
          make translations-extract
          make translations-check
          make translations-compile
      - name: Vérifier les imports des tests dans cet environnement
        run: make test TESTS=tests.config.test_test_collection
      - name: Vérifier Django et les migrations
        run: make check
      - name: Exécuter les tests PostgreSQL
        run: make test
      - name: Vérifier la transition des utilisateurs sur une base locale jetable
        run: make users-upgrade-test
