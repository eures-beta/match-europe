name: Vérification de main avant déploiement

on:
  push:
    # Validate stack heads even when GitHub has not refreshed their PR merge ref.
    branches: [main, 'codex/**']
  # Stacked delivery PRs must run the same PostgreSQL checks before reaching main.
  pull_request:

permissions:
  contents: read

# A push and its PR event can target the same source revision. Keep one check;
# the production relay still accepts only a successful push on main.
concurrency:
  group: readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e-memory:
    name: Parcours HTTP — 256 Mio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Le témoin négatif exporte exactement le code historique avant #177.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Vérifier les parcours actuels sous plafond mémoire réel
        run: make e2e-test
      - name: Vérifier que le banc détecte la régression historique
        run: make e2e-regression
      - name: Publier uniquement les mesures, jamais les emails ou liens secrets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-memory-reports
          path: |
            .runtime/e2e-report.json
            .runtime/e2e-legacy-report.json
          if-no-files-found: ignore
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tests
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: '0'
      DJANGO_HTTPS: '0'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: tests
      PGUSER: tests
      PGPASSWORD: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Installer les dépendances applicatives et de test
        run: make install-test
      - name: Installer GNU gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Vérifier les traductions extraites et compiler les catalogues
        run: |
          make translations-extract
          make translations-check
          make translations-compile
      - name: Vérifier les imports des tests dans cet environnement
        run: make test TESTS=config.test_test_collection
      - name: Vérifier Django et les migrations
        run: make check
      - name: Exécuter les tests PostgreSQL
        run: make test
      - name: Vérifier la transition des utilisateurs sur une base locale jetable
        run: make users-upgrade-test
