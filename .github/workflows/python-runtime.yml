name: Mise à jour hebdomadaire de Python

on:
  schedule:
    # Lundi 07:15 UTC ; indépendant des changements heure été/hiver.
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-runtime-update
  cancel-in-progress: false

jobs:
  propose:
    # La maintenance part toujours de main, jamais d'un ref saisi au lancement.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - run: make python-runtime-test
      - name: Résoudre une version stable et verrouiller son image
        run: make python-update
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Proposer la mise à jour et lancer les contrôles
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const propose = require('./.github/python-update.cjs');
            await propose({github, context, core});
