name: Mise à jour hebdomadaire de Python

on:
  schedule:
    # Lundi 07:15 UTC ; indépendant des changements heure été/hiver.
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-runtime-update
  cancel-in-progress: false

jobs:
  propose:
    # La maintenance part toujours de main, jamais d'un ref saisi au lancement.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - run: make python-runtime-verify
      - name: Résoudre une version stable et verrouiller son image
        run: make python-update
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Proposer la mise à jour et lancer les contrôles
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const propose = require('./.github/python-update.cjs');
            await propose({github, context, core});
