name: Demande de recette

on:
  # Unlike pull_request, this metadata-only signal also runs with merge conflicts.
  # Never add checkout, credentials or execution of PR-controlled content here.
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'recette 24h' || github.event.label.name == 'recette 7j' ||
       contains(github.event.pull_request.labels.*.name, 'recette 24h') ||
       contains(github.event.pull_request.labels.*.name, 'recette 7j'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # No checkout, build, credentials or PR-provided scripts in this job.
      - run: echo 'Demande transmise au relais après cette exécution.'
